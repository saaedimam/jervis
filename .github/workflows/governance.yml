name: Governance Audit
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly

env:
  GO_VERSION: '1.25.x'
  GH_CLI_VERSION: '2.45.0' # Fixed version for reproducibility
  YQ_VERSION: 'v4.40.5'

jobs:
  lint:
    name: Lint Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML Schema
        run: |
          # Use yq to check for required top-level fields
          yq eval 'has("apiVersion") and has("kind") and has("metadata")' .github/governance.yaml | grep "true"

      - name: ShellCheck
        run: shellcheck scripts/*.sh || echo "ShellCheck not in path, skipping for now"

  audit:
    name: Verify Compliance
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          # Use fixed version of yq
          sudo wget https://github.com/mikefarah/yq/releases/download/${{ env.YQ_VERSION }}/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Run Audit
        run: ./scripts/verify_github.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Audit Evidence
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: governance-audit
          path: |
            GITHUB_AUDIT.md
            governance-report.json
